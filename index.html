<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Hamlet Pop-Upper</title>
<!-- Candidate: Hamlet Pop-Upper v1.8 -->
<style>
:root{
  --field:#0f100e;
  --paper:#d9d9cc;
  --paper-hi:#e4e4d8;
  --ink:#171814;
  --muted:#5b5d55;
  --bone:#e8e5d7;
  --signal:#ff6238;
  --signal-paper:#a92f16;
  --mono:"Courier New",Courier,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --serif:Georgia,"Times New Roman",Times,serif;
  --mortality-reach:22vw;
  --mortality-rise:0px;
  --safe-t:max(12px,env(safe-area-inset-top));
  --safe-r:max(12px,env(safe-area-inset-right));
  --safe-b:max(12px,env(safe-area-inset-bottom));
  --safe-l:max(12px,env(safe-area-inset-left));
}
*{box-sizing:border-box}
html,body{margin:0;min-width:280px;min-height:100%;background:var(--field)}
body{overflow:hidden;color:var(--bone);font-family:var(--mono);-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
button,input{font:inherit}
button{-webkit-tap-highlight-color:transparent}
.work{
  position:relative;isolation:isolate;width:100%;height:100svh;min-height:320px;overflow:hidden;
  background:
    linear-gradient(rgba(255,255,255,.012) 1px,transparent 1px) 0 0/100% 3px,
    radial-gradient(circle at 61% 32%,rgba(255,255,255,.018),transparent 34%),
    var(--field);
}
.work::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.07;mix-blend-mode:screen;
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 1px,transparent 1px 5px);
}
.work::after{content:"";position:absolute;inset:0;pointer-events:none;border:1px solid rgba(232,229,215,.03)}
.work-title{
  position:absolute;z-index:1;top:calc(var(--safe-t) + 6px);left:calc(var(--safe-l) + 7px);
  color:rgba(232,229,215,.33);font:700 9px/1 var(--mono);letter-spacing:.17em;text-transform:uppercase;user-select:none
}
.work-title::before{content:"";display:inline-block;width:13px;height:1px;margin:0 9px 3px 0;background:currentColor}

.mortality-field{
  /* v1.8 follow-up: z-index raised above .machine-afterimage (11) — at the terminal scene the
     skull now looms large behind the accumulated lines; the text must stay legible in front of it. */
  position:absolute;z-index:12;left:clamp(28px,5.2vw,78px);bottom:clamp(34px,6vh,70px);
  width:min(530px,43vw);min-width:300px;pointer-events:none;transform:translateY(calc(-1 * var(--mortality-rise)));transition:transform 260ms steps(3,end)
}
.mortality-list{list-style:none;margin:0;padding:0;display:grid;gap:clamp(4px,.7vh,8px)}
.death{
  position:relative;width:max-content;max-width:100%;color:var(--bone);font-family:var(--serif);
  font-size:clamp(18px,1.45vw,22px);font-weight:400;line-height:1.18;letter-spacing:-.018em;transform-origin:left center
}
.death::before{content:"";position:absolute;z-index:-1;left:calc(100% + 12px);top:56%;width:var(--reach,0);height:1px;background:linear-gradient(90deg,rgba(232,229,215,.18),rgba(232,229,215,.055) 72%,transparent);transform-origin:left center;pointer-events:none}
.death.is-new::before{animation:reach-write 320ms steps(4,end) both}
@keyframes reach-write{0%{transform:scaleX(0);opacity:0}100%{transform:scaleX(1);opacity:1}}
.death[data-age="7"]{opacity:.52}.death[data-age="6"]{opacity:.58}.death[data-age="5"]{opacity:.64}.death[data-age="4"]{opacity:.70}
.death[data-age="3"]{opacity:.76}.death[data-age="2"]{opacity:.83}.death[data-age="1"]{opacity:.91}.death[data-age="0"]{opacity:1}
.death:not([data-age="0"])::after{
  content:"";position:absolute;left:-2px;right:-4px;top:50%;height:1px;opacity:.07;background:currentColor;
  transform:translateY(calc((var(--scar,0) - .5)*5px))
}
.death.is-new{animation:death-write 170ms steps(3,end) both}
.death.is-terminal{margin-top:clamp(8px,1.15vh,14px);font-size:clamp(24px,1.95vw,30px);letter-spacing:-.03em;opacity:1}
@keyframes death-write{0%{opacity:0;clip-path:inset(0 100% 0 0);transform:translateX(2px)}35%{opacity:.45;clip-path:inset(0 63% 0 0)}70%{opacity:.78;clip-path:inset(0 17% 0 0);transform:translateX(-1px)}100%{opacity:1;clip-path:inset(0);transform:none}}
.event-trace{position:absolute;z-index:1;left:0;top:0;width:2px;height:100%;pointer-events:none}
.event-trace.flash{animation:trace-flash 220ms steps(2,end)}
@keyframes trace-flash{0%,100%{background:transparent}35%{background:var(--signal)}65%{background:rgba(255,98,56,.19)}}

dialog.hamlet-dialog{
  --pressure-y:0px;position:fixed;z-index:20;top:calc(39% + var(--pressure-y));left:58%;
  width:min(676px,calc(100vw - 48px));max-width:none;max-height:calc(100svh - 24px);margin:0;padding:0;
  overflow:visible;border:0;background:transparent;color:var(--ink);transform:translate(-50%,-50%)
}
dialog.hamlet-dialog::backdrop{background:rgba(15,16,14,.015)}
.window{
  position:relative;width:100%;max-height:calc(100svh - 24px);overflow:auto;overscroll-behavior:contain;
  background:var(--paper);border:2px solid var(--ink);
  clip-path:polygon(0 0,31% 0,32.3% 5px,67.7% 5px,69% 0,calc(100% - 13px) 0,100% 13px,100% 100%,13px 100%,0 calc(100% - 13px));
  box-shadow:5px 5px 0 rgba(0,0,0,.88),6px 6px 0 rgba(217,217,204,.08);
  scrollbar-width:thin;scrollbar-color:var(--muted) var(--paper)
}
.window::after{content:"";position:absolute;inset:5px 6px 6px 5px;border:1px solid rgba(23,24,20,.16);clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px));pointer-events:none}
.window.opening{animation:window-in 170ms steps(3,end) both}.window.withdrawing{animation:window-out 140ms steps(2,end) both}.window.dying{animation:window-die 620ms steps(5,end) both}
@keyframes window-in{0%{opacity:0;transform:translate(4px,-3px);clip-path:inset(0 0 100% 0)}38%{opacity:.72;clip-path:inset(0 0 54% 0)}72%{opacity:1;transform:translate(-1px,1px);clip-path:inset(0 0 11% 0)}100%{transform:none;clip-path:inset(0)}}
@keyframes window-out{0%{opacity:1;transform:none}55%{opacity:.7;transform:translate(2px,1px)}100%{opacity:0;transform:translate(4px,3px)}}
@keyframes window-die{0%{opacity:1;transform:none;box-shadow:5px 5px 0 rgba(0,0,0,.88)}16%{box-shadow:none;transform:translate(1px,0)}34%{transform:translate(-2px,1px) skewX(-.35deg)}52%{clip-path:polygon(0 0,88% 0,92% 8%,100% 8%,100% 61%,0 58%);opacity:.82}72%{clip-path:polygon(0 0,73% 0,79% 12%,100% 12%,100% 36%,0 33%);opacity:.49}100%{clip-path:polygon(0 0,44% 0,51% 16%,100% 16%,100% 17%,0 15%);opacity:0;transform:translate(3px,2px)}}
.instrument-rail{
  position:relative;z-index:2;height:24px;display:grid;grid-template-columns:1fr 34px 1fr;align-items:center;
  border-bottom:2px solid var(--ink);background:var(--paper-hi);color:var(--ink);
  font:700 9px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;user-select:none
}
.rail-name{height:100%;display:flex;align-items:center;padding:0 11px;border-right:1px solid rgba(23,24,20,.45)}
.rail-mark{height:100%;display:grid;place-items:center;border-right:1px solid rgba(23,24,20,.45);font:400 15px/1 var(--serif)}
/* v1.8 / HPU-05, ballot r2, verdict promote_both */
.skull-glyph{display:block;shape-rendering:crispEdges}
.rail-mark .skull-glyph{color:var(--ink)}
.title-status{height:100%;display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:0 11px;color:var(--muted);letter-spacing:.08em}
.run-bit{width:6px;height:6px;border:1px solid currentColor}dialog[open] .run-bit{background:var(--ink)}
/* v1.8 / HPU-14: a wordless "alive, waiting" signal for the closed/idle gap between calls —
   visible dramatic time (HZN-006) should read as time passing, not as nothing happening. */
.run-bit.is-idle{animation:idle-pulse 2400ms ease-in-out infinite}
@keyframes idle-pulse{0%,100%{opacity:.35}50%{opacity:.9}}
/* v1.8 / HPU-13: "ask me later" made legible without a word of explanatory prose — a hairline
   under the work-title that drains from full to empty over the exact deferral it stands for.
   Lives on the main stage, not inside the dialog: the dialog is closed for the whole deferral,
   so anything placed inside it would be invisible for exactly the period it needs to show. */
.defer-gauge{
  position:absolute;z-index:1;top:calc(var(--safe-t) + 17px);left:calc(var(--safe-l) + 7px);
  height:1px;width:64px;background:var(--signal-paper);opacity:0;transform-origin:left center;transform:scaleX(0)
}
.question-shell{position:relative;z-index:1;display:grid;grid-template-columns:minmax(175px,.72fr) minmax(0,1.28fr);min-height:208px}
.question-chamber{position:relative;padding:29px 24px 25px 28px;border-right:1px solid rgba(23,24,20,.34);display:flex;align-items:flex-end}
.chamber-label{position:absolute;top:10px;left:28px;color:var(--muted);font:700 8px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase}
.prompt{margin:0;max-width:17ch;color:var(--ink);font-family:var(--serif);font-size:clamp(25px,2.1vw,31px);font-weight:400;line-height:1.11;letter-spacing:-.03em}
.prompt:focus{outline:none}
.control-side{padding:26px 25px 21px;display:flex;flex-direction:column;justify-content:center}
.decision-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:0}
.decision{
  position:relative;min-width:0;min-height:58px;padding:10px 13px 9px;border:2px solid var(--ink);border-radius:0;
  background:transparent;color:var(--ink);font:700 13px/1 var(--mono);letter-spacing:.105em;text-transform:uppercase;cursor:pointer;touch-action:manipulation
}
.decision::after{content:"";position:absolute;inset:3px;border:1px solid transparent;pointer-events:none}
.decision.remembered{
  transform:translate(-1px,1px);
  background-image:linear-gradient(168deg,transparent 0 44%,rgba(169,47,22,.42) 44.4% 45.1%,transparent 45.6%),linear-gradient(168deg,transparent 0 58%,rgba(23,24,20,.16) 58.4% 59%,transparent 59.5%),repeating-linear-gradient(90deg,transparent 0 9px,rgba(23,24,20,.035) 9px 10px);
  box-shadow:inset -2px 0 0 rgba(23,24,20,.15),inset 0 -2px 0 rgba(23,24,20,.12)
}
.decision.remembered::before{content:"";position:absolute;left:7px;top:7px;width:6px;height:6px;border:1px solid var(--signal-paper);transform:rotate(45deg);opacity:.8}
.decision.chosen{background:var(--ink);color:var(--paper);background-image:none}
.decision:active,.later:active{transform:translate(1px,1px)}
.decision:focus-visible,.later:focus-visible,.restart:focus-visible,.remember input:focus-visible+.checkmark{outline:2px solid var(--signal-paper);outline-offset:3px;box-shadow:0 0 0 1px var(--paper),0 0 0 4px var(--ink)}
.utility-row{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-top:18px;min-height:42px;border-top:1px solid rgba(23,24,20,.22);padding-top:12px}
.remember{position:relative;display:inline-flex;align-items:center;gap:10px;min-height:42px;color:var(--muted);font:700 10px/1.2 var(--mono);letter-spacing:.025em;cursor:pointer;user-select:none}
.remember input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.checkmark{position:relative;flex:0 0 auto;width:15px;height:15px;border:2px solid var(--ink);background:transparent}
.remember input:checked+.checkmark::after{content:"";position:absolute;left:2px;top:2px;width:7px;height:4px;border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(-45deg) translateY(-1px);transform-origin:center}
.later{flex:0 0 auto;min-height:40px;padding:8px 11px 7px;border:1px solid var(--ink);border-radius:0;background:transparent;color:var(--ink);font:700 9px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;cursor:pointer;touch-action:manipulation}
.machine-note{min-height:16px;margin-top:6px;color:var(--muted);font:700 8px/1.3 var(--mono);letter-spacing:.065em;text-transform:uppercase}
.machine-note:empty{visibility:hidden}

/* v1.6: all scored deaths pass through the questioning apparatus before becoming history. */
.question-shell{overflow:hidden}
.wound-layer{position:absolute;z-index:5;inset:0;pointer-events:none;overflow:hidden}
.wound{position:absolute;height:1px;transform-origin:left center;opacity:.18;background:linear-gradient(90deg,rgba(169,47,22,.9),rgba(23,24,20,.25) 68%,transparent)}
.wound[data-kind="deferred"]{background:repeating-linear-gradient(90deg,rgba(169,47,22,.72) 0 5px,transparent 5px 9px);opacity:.17}
.wound[data-kind="answered"],.wound[data-kind="answer_collision"]{opacity:.21}
.wound[data-kind="unanswered"]{opacity:.15}
.wound[data-kind="terminal"]{height:2px;opacity:.32;background:linear-gradient(90deg,rgba(169,47,22,.95),rgba(23,24,20,.5) 72%,transparent)}
/* v1.7 / HPU-B5: a death that meets the machine while an answer is remembered is a distinct
   encounter — the memory system now feeds the wound system instead of staying cosmetic. */
.wound[data-kind="recalled"]{height:1px;opacity:.24;background:linear-gradient(90deg,rgba(169,47,22,.85),transparent 55%),linear-gradient(90deg,rgba(169,47,22,.4),transparent 55%);background-position:0 0,0 3px;background-repeat:no-repeat}
.window[data-impact-kind="recalled"] .event-incision::before{background:linear-gradient(90deg,rgba(169,47,22,.85),transparent 60%),linear-gradient(90deg,rgba(169,47,22,.4),transparent 60%);background-position:0 0,0 3px;background-repeat:no-repeat}
/* v1.7 / HPU-B1: a wound is felt once, at the moment it is made, then settles to the same
   low-contrast residue as before — causality is legible on arrival, not as an infographic. */
.wound.is-new{animation:wound-arrive 1500ms steps(9,end) both}
@keyframes wound-arrive{0%{opacity:.85}12%{opacity:.85}100%{opacity:var(--rest,.2)}}
/* v1.7 / HPU-B3: the one moment the apparatus is allowed to speak the character's line — marked,
   not hidden. A single hairline states the collapse is deliberate, then withdraws. */
.window.terminal-marked::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--signal-paper);opacity:0;animation:terminal-mark 1400ms steps(6,end) both}
@keyframes terminal-mark{0%{opacity:0}18%{opacity:1}100%{opacity:0}}
/* v1.7 / HPU-B2: a call the machine scheduled and a call a death forced are the same badge —
   only the forced one is allowed a single admission that something just happened to it. */
#callCounter.hit{animation:call-hit 900ms steps(4,end) both}
@keyframes call-hit{0%{color:var(--signal-paper)}100%{color:inherit}}
.event-incision{
  position:absolute;z-index:6;inset:23px 14px 14px 18px;display:flex;align-items:flex-end;
  opacity:0;pointer-events:none;transform:translateX(-3px);transition:opacity 70ms steps(1,end),transform 120ms steps(2,end)
}
.event-incision::before{content:"";position:absolute;left:0;right:-44%;bottom:4px;height:1px;background:linear-gradient(90deg,rgba(169,47,22,.78),rgba(23,24,20,.26) 72%,transparent);transform:scaleX(.06);transform-origin:left;transition:transform 420ms steps(5,end)}
.event-incision-text{position:relative;z-index:1;margin:0 0 11px;color:var(--signal-paper);font:400 clamp(19px,1.65vw,24px)/1.12 var(--serif);letter-spacing:-.025em;max-width:21ch;outline:none}
.window[data-mode="impact"] .event-incision,.window[data-mode="terminal"] .event-incision{opacity:1;transform:none}
.window[data-mode="impact"] .event-incision::before,.window[data-mode="terminal"] .event-incision::before{transform:scaleX(1)}
.window[data-mode="impact"] .prompt{opacity:.10;transform:translateY(2px)}
.window[data-mode="impact"] .control-side{opacity:.26;filter:grayscale(1)}
.window[data-mode="impact"] .decision,.window[data-mode="impact"] .later,.window[data-mode="impact"] .remember{pointer-events:none}
.window[data-mode="terminal"] .prompt{opacity:0}
.window[data-mode="terminal"] .control-side{opacity:.025;filter:grayscale(1)}
.window[data-mode="terminal"] .event-incision{inset:23px 20px 14px 28px;align-items:center}
.window[data-mode="terminal"] .event-incision::before{bottom:50%;right:-64%;height:2px;background:linear-gradient(90deg,rgba(169,47,22,.95),rgba(232,229,215,.12) 62%,transparent)}
.window[data-mode="terminal"] .event-incision-text{margin:0;color:var(--ink);font-size:clamp(30px,3vw,44px);letter-spacing:-.045em}
.window[data-impact-kind="deferred"] .event-incision::before{background:repeating-linear-gradient(90deg,rgba(169,47,22,.72) 0 7px,transparent 7px 12px)}
.window[data-impact-kind="answer_collision"] .event-incision::before{height:2px}

/* v1.8 / HPU-12: an interaction gets the same "speaks on the popup surface first" beat a scored
   death already gets, before it withdraws into the mortality field's accumulated lines — the two
   directions of the relation (yours in, the world's out) now read as one grammar, not two. Ink,
   not rust: this is your trace, not an event's. */
.window[data-trace] .event-incision{opacity:1;transform:none}
.window[data-trace] .event-incision::before{transform:scaleX(1);background:linear-gradient(90deg,rgba(23,24,20,.5),transparent 70%)}
.window[data-trace] .event-incision-text{color:var(--ink)}
.window[data-trace] .prompt{opacity:.18}
.window[data-trace] .control-side{opacity:.4;filter:grayscale(1)}

.world-claims{position:fixed;inset:0;z-index:19;width:100vw;height:100svh;pointer-events:none;overflow:visible}
.world-claims line{stroke:rgba(169,47,22,.16);stroke-width:.85;vector-effect:non-scaling-stroke}
.world-claims line.claim-old{stroke:rgba(232,229,215,.07)}
.machine-afterimage{position:fixed;z-index:11;pointer-events:none;opacity:0;border:1px solid rgba(232,229,215,.11);background:repeating-linear-gradient(0deg,rgba(232,229,215,.012) 0 1px,transparent 1px 4px);box-shadow:inset 0 0 0 4px rgba(232,229,215,.012);clip-path:polygon(0 0,31% 0,32.3% 5px,67.7% 5px,69% 0,calc(100% - 13px) 0,100% 13px,100% 100%,13px 100%,0 calc(100% - 13px))}
.after-rail,.after-divider,.after-plate{position:absolute;border-color:rgba(232,229,215,.075);border-style:solid}
.after-rail{left:0;right:0;top:24px;border-width:1px 0 0}
.after-divider{top:24px;bottom:0;left:36%;border-width:0 0 0 1px}
.after-plate{top:39%;height:28%;width:25%;border-width:1px}.after-plate.a{left:43%}.after-plate.b{left:71%}
.machine-afterimage::before{content:"";position:absolute;left:43%;right:4%;top:73%;height:1px;background:rgba(232,229,215,.05)}
/* v1.8 follow-up: bigger, foregrounded — sized off the viewport, not the small chassis rect it
   sits in, so it deliberately outgrows the structural burn around it and reads as what remains
   in front, not a detail still trapped inside the old frame. */
.after-skull{
  position:absolute;top:50%;left:50%;
  width:clamp(150px,46vmin,360px);height:clamp(150px,46vmin,360px);
  color:rgba(232,229,215,.42);opacity:0;transform:translate(-50%,-50%) scale(.72)
}
.machine-afterimage.is-present{animation:afterimage-arrive 880ms steps(5,end) forwards}
.machine-afterimage.is-present .after-skull{animation:skull-emerge 1300ms steps(8,end) 260ms both}
@keyframes afterimage-arrive{0%{opacity:0;filter:blur(1.4px)}38%{opacity:.34;filter:blur(.4px)}100%{opacity:1;filter:none}}
@keyframes skull-emerge{0%{opacity:0;transform:translate(-50%,-50%) scale(.72)}38%{opacity:.34;transform:translate(-50%,-50%) scale(.86)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.restart{
  position:absolute;z-index:5;right:calc(var(--safe-r) + 7px);bottom:calc(var(--safe-b) + 5px);min-width:70px;min-height:38px;padding:8px 9px;
  border:1px solid rgba(232,229,215,.42);border-radius:0;background:transparent;color:rgba(232,229,215,.52);font:700 9px/1 var(--mono);letter-spacing:.1em;cursor:pointer;
  opacity:0;pointer-events:none;transition:opacity 130ms steps(2,end)
}
.restart.is-visible{opacity:1;pointer-events:auto}
.restart[hidden]{display:none}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
noscript{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:rgba(232,229,215,.55);font:12px/1.4 var(--mono)}
@media (hover:hover) and (pointer:fine){.decision:hover::after{border-color:rgba(23,24,20,.45)}.later:hover{background:rgba(23,24,20,.06)}.restart:hover{color:var(--bone);border-color:rgba(232,229,215,.55)}}


@media (min-width:701px) and (max-width:900px){
  dialog.hamlet-dialog{left:50%;width:calc(100vw - 48px)}
}
@media (max-width:700px){
  .work-title{left:calc(var(--safe-l) + 1px);font-size:8px}
  .mortality-field{left:calc(var(--safe-l) + 5px);right:calc(var(--safe-r) + 5px);bottom:calc(var(--safe-b) + 20px);width:auto;min-width:0}
  .mortality-list{gap:4px}.death{font-size:clamp(17px,5.05vw,21px)}.death.is-terminal{font-size:clamp(22px,6.4vw,27px);margin-top:6px}
  dialog.hamlet-dialog{top:calc(43% + var(--pressure-y));left:50%;width:calc(100vw - var(--safe-l) - var(--safe-r) - 10px);max-width:460px;max-height:calc(100svh - 18px)}
  .window{max-height:calc(100svh - 18px);box-shadow:3px 3px 0 rgba(0,0,0,.9)}

function setIdle(on){el.runBit.classList.toggle('is-idle',on)}
/* v1.8 / HPU-13: shown for the exact real-duration of the deferral; hidden the instant the

/* v1.8 / HPU-11: the machine never spontaneously reopens later than it can afford to — capped by

  if(event.id==='father'||el.wounds.querySelector('[data-event="'+event.id+'"]'))return;

  addWound(event,kind);updateAges();setPressure();flashTrace();requestAnimationFrame(drawClaims);if(immediate)el.live.textContent=event.text;
}
function seedCondition(){el.list.replaceChildren();el.wounds.replaceChildren();encounterRecords.clear();commitDeath(INITIAL_DEATH,'condition',true)}
function safeOpenDialog(){if(el.dialog.open)return true;try{el.dialog.showModal();return true}catch(_){try{el.dialog.setAttribute('open','');return true}catch(__){return false}}}
function safeCloseDialog(){try{if(el.dialog.open)el.dialog.close()}catch(_){el.dialog.removeAttribute('open')}}
function focusPrompt(){requestAnimationFrame(()=>{try{el.prompt.focus({preventScroll:true})}catch(_){el.prompt.focus()}})}
function focusIncision(){requestAnimationFrame(()=>{try{el.incisionText.focus({preventScroll:true})}catch(_){}})}
function openQuestion(cause='scheduled'){
  if(terminal||machineState!=='closed'||actionLock)return false;
  setIdle(false);hideDeferGauge();
  callCount++;nextAskAt=Infinity;visibleRemembered=remembered;el.callCounter.textContent='call '+String(callCount).padStart(2,'0');el.window.classList.remove('withdrawing','dying');el.window.classList.add('opening');setMode('question');updateMemoryUI(true);
  if(!safeOpenDialog())return false;machineState='question';actionLock=false;machineSound('open');
  requestAnimationFrame(()=>{if(machineState!=='question')return;captureMachineRect();drawClaims();focusPrompt();setTimeout(()=>el.window.classList.remove('opening'),220)});return true
}
function finishClose(){
  safeCloseDialog();el.window.classList.remove('withdrawing');machineState='closed';actionLock=false;
  /* v1.8 / HPU-13/14: the two idle signals never compete — the gauge (a specific promise
     draining) suppresses the generic idle-pulse (nothing in particular pending) for as long as
     the deferral is genuinely active. */
  setIdle(!(lastDismissReason==='later'&&worldElapsed<deferredUntil));
  requestAnimationFrame(drawClaims)
}
function closeQuestion(reason){
  if(machineState!=='question'||actionLock||terminal)return;
  actionLock=true;machineState='closing';lastDismissReason=reason;lastInteractionAt=worldElapsed;el.window.classList.add('withdrawing');
  nextAskAt=scheduleReturn(reason);deferredUntil=reason==='later'?nextAskAt:0;
  if(reason==='later')showDeferGauge(nextAskAt-worldElapsed);
  if(closeTimer)clearTimeout(closeTimer);closeTimer=setTimeout(()=>{closeTimer=null;finishClose()},TIMING.closeAnimation)
}
function chooseAnswer(value,button){
  if(machineState!=='question'||actionLock||terminal)return;unlockAudio();machineSound('touch');actionLock=true;chosenPending=true;lastDismissReason='answer';lastAnswerValue=value;lastInteractionAt=worldElapsed;deferredUntil=0;button.classList.add('chosen');
  if(el.remember.checked){remembered=value;storageWrite(value);if(!storageOK)memoryWarningShown=true}updateMemoryUI();
  /* v1.8 / HPU-12: the answer speaks once on the popup surface — "to be." / "not to be." — before
     it withdraws, the same shape a scored death's incision already takes. */
  el.incisionText.textContent=value==='to_be'?'to be.':'not to be.';el.window.dataset.trace='answer';
  answerTimer=setTimeout(()=>{answerTimer=null;button.classList.remove('chosen');chosenPending=false;delete el.window.dataset.trace;el.incisionText.textContent='';if(terminal)return;actionLock=false;closeQuestion('answer')},TIMING.traceHold)
}
function askLater(){
  if(machineState!=='question'||actionLock||terminal)return;
  unlockAudio();machineSound('touch');actionLock=true;
  /* v1.8 / HPU-12: "later" gets the same one-beat trace as an answer, kept wordless (an em dash,
     not a sentence) to match the piece's register — reuses answerTimer since the two are
     mutually exclusive by the machineState==='question' guard above. */
  el.incisionText.textContent='—';el.window.dataset.trace='later';
  answerTimer=setTimeout(()=>{answerTimer=null;delete el.window.dataset.trace;el.incisionText.textContent='';if(terminal)return;actionLock=false;closeQuestion('later')},TIMING.traceHold)
}
function classifyEncounter(){
  if(machineState==='question'&&chosenPending)return 'answer_collision';
  if(machineState==='question')return 'unanswered';
  if(machineState==='closing')return lastDismissReason==='later'?'deferred':'answer_collision';
  if(machineState==='closed'&&lastDismissReason==='later'&&worldElapsed<deferredUntil)return 'deferred';
  /* v1.7 / HPU-B5: once an answer is remembered, every death that meets a closed, non-deferred
     machine meets a machine that remembers — recalled supersedes plain answered/closed for as
     long as the memory holds. An active deferral (checked above) still wins: a promise to answer
     later is more specific than a standing memory. */
  if(machineState==='closed'&&remembered)return 'recalled';
  if(machineState==='closed'&&lastDismissReason==='answer')return 'answered';
  return 'closed'
}
function clearTransientTimers(){
  if(closeTimer){clearTimeout(closeTimer);closeTimer=null}if(answerTimer){clearTimeout(answerTimer);answerTimer=null}if(impactTimer){clearTimeout(impactTimer);impactTimer=null}
}
function presentImpact(event,kind){
  el.incisionText.textContent=event.text;setMode('impact',kind);enableControls(false);actionLock=true;worldSound(false);focusIncision();captureMachineRect();requestAnimationFrame(drawClaims)
}
function beginImpact(event){
  if(terminal)return;const kind=classifyEncounter(),wasChosen=chosenPending,wasClosing=machineState==='closing',deferActive=lastDismissReason==='later'&&worldElapsed<deferredUntil;
  encounterRecords.set(event.id,{kind,at:worldElapsed,call:callCount,answer:lastAnswerValue});
  setIdle(false);
  /* v1.8 / HPU-13: a death does not cancel an active deferral (DR-16-02, unchanged) — so it must
     not silently kill the gauge that stands for it either. Only hide the gauge when the deferral
     itself is actually ending here (every other encounter kind, including a lapsed 'later'). */
  if(!(kind==='deferred'&&deferActive))hideDeferGauge();
  /* v1.8 / HPU-12: a death can interrupt a pending answer/later trace mid-beat — presentImpact()
     is about to overwrite the incision text anyway, but the stale data-trace attribute (and its
     ink-colored styling) must not leak into impact/terminal mode. */
  if(answerTimer){clearTimeout(answerTimer);answerTimer=null;el.toBe.classList.remove('chosen');el.notToBe.classList.remove('chosen');chosenPending=false;delete el.window.dataset.trace}
  if(closeTimer){clearTimeout(closeTimer);closeTimer=null;el.window.classList.remove('withdrawing')}
  if(!safeOpenDialog())return;machineState='impact';presentImpact(event,kind);
  impactTimer=setTimeout(()=>{
    impactTimer=null;commitDeath(event,kind,false);clearIncision();
    if(terminal)return;
    if((kind==='answer_collision'&&wasChosen)||(kind==='answer_collision'&&wasClosing&&lastDismissReason==='answer')){
      nextAskAt=Math.min(nextAskAt,worldElapsed+Math.max(160,TIMING.deathRecallAfterAnswer-(worldElapsed-event.at)));setMode('question');enableControls(false);machineState='closing';actionLock=true;el.window.classList.add('withdrawing');closeTimer=setTimeout(()=>{closeTimer=null;finishClose()},TIMING.closeAnimation);return
    }
    if(kind==='deferred'&&deferActive){setMode('question');enableControls(false);machineState='closing';actionLock=true;el.window.classList.add('withdrawing');closeTimer=setTimeout(()=>{closeTimer=null;finishClose()},TIMING.closeAnimation);return}
    // A death met a closed/answered/recalled machine, or an already-open one nobody had answered:
    // either way, it becomes the next call. v1.8 / HPU-15: this used to silently resume the SAME
    // open dialog when kind==='unanswered' — the chassis never re-presented itself, so a visitor
    // who missed one round saw the identical still-open popup for the rest of the piece, with no
    // signal that anything had renewed. Every path here now gets the same visible re-announcement.
    presentNextCall()
  },TIMING.impactHold)
}
function presentNextCall(){
  el.window.classList.remove('dying');el.window.classList.add('withdrawing');
  closeTimer=setTimeout(()=>{
    closeTimer=null;if(terminal)return;
    /* v1.8 / HPU-15: a genuine close+reopen, not just a CSS fade — matches the native-dialog
       pattern used everywhere else in this file, and re-triggers assistive-tech announcement of
       the modal the same way any other fresh call already does. */
    safeCloseDialog();
    el.window.classList.remove('withdrawing');el.window.classList.add('opening');
    setMode('question');machineState='question';actionLock=false;callCount++;nextAskAt=Infinity;
    visibleRemembered=remembered;el.callCounter.textContent='call '+String(callCount).padStart(2,'0');
    el.callCounter.classList.remove('hit');void el.callCounter.offsetWidth;el.callCounter.classList.add('hit');
    updateMemoryUI(true);
    if(!safeOpenDialog())return;
    machineSound('open');focusPrompt();captureMachineRect();requestAnimationFrame(drawClaims);
    setTimeout(()=>el.window.classList.remove('opening'),220)
  },TIMING.closeAnimation)
}
function beginTerminal(event){
  if(terminal)return;terminal=true;nextAskAt=Infinity;clearTransientTimers();const kind='terminal';encounterRecords.set(event.id,{kind,at:worldElapsed,call:callCount,answer:lastAnswerValue});
  setIdle(false);hideDeferGauge();
  el.toBe.classList.remove('chosen');el.notToBe.classList.remove('chosen');chosenPending=false;delete el.window.dataset.trace;if(!safeOpenDialog())return;machineState='terminal';actionLock=true;captureMachineRect();el.incisionText.textContent=event.text;setMode('terminal',kind);enableControls(false);worldSound(true);focusIncision();requestAnimationFrame(drawClaims);
  /* v1.7 / HPU-B3, resolved A: the apparatus is kept speaking "So am I." as its own line —
     this hairline marks that one collapse of interface/character as deliberate, not missed.
     Remove-then-add (v1.8 fix) so the mark still plays after a restart, not just on first run. */
  el.window.classList.remove('terminal-marked');void el.window.offsetWidth;el.window.classList.add('terminal-marked');
  terminalTimers.push(setTimeout(()=>{
    commitDeath(event,kind,false);addWound(event,kind);captureMachineRect();el.window.classList.remove('opening','withdrawing');el.window.classList.add('dying');machineState='dying';
    terminalTimers.push(setTimeout(()=>{safeCloseDialog();el.window.classList.remove('dying');machineState='dead';showAfterimage();audioSuppressed=true;terminalTimers.push(setTimeout(()=>{el.restart.hidden=false;requestAnimationFrame(()=>el.restart.classList.add('is-visible'))},TIMING.restartReveal));if(kiosk)terminalTimers.push(setTimeout(restartWork,TIMING.kioskRestart))},TIMING.terminalWindowDeath))
  },TIMING.terminalAnswerHold))
}
function deliverScoreEvent(event){if(event.terminal)beginTerminal(event);else beginImpact(event)}
function clearRunTimers(){terminalTimers.forEach(clearTimeout);terminalTimers=[];clearTransientTimers()}
function restartWork(){
  clearRunTimers();safeCloseDialog();el.window.classList.remove('opening','withdrawing','dying','terminal-marked');delete el.window.dataset.trace;hideDeferGauge();el.restart.classList.remove('is-visible');el.restart.hidden=true;clearAfterimage();audioSuppressed=false;worldElapsed=0;lastTick=performance.now();nextScoreIndex=0;nextAskAt=TIMING.firstAskAt;callCount=0;machineState='closed';lastDismissReason=null;lastAnswerValue=null;lastInteractionAt=-Infinity;deferredUntil=0;terminal=false;actionLock=false;chosenPending=false;lastMachineRect=null;el.dialog.style.setProperty('--pressure-y','0px');el.work.style.setProperty('--mortality-rise','0px');el.incisionText.textContent='';setMode('question');seedCondition();visibleRemembered=remembered;updateMemoryUI(true);setIdle(true);requestAnimationFrame(drawClaims)
}
function processScore(){
  if(terminal)return;
  if(nextScoreIndex<SCORE.length&&worldElapsed>=SCORE[nextScoreIndex].at&&machineState!=='impact'&&machineState!=='terminal'&&machineState!=='dying'){
    const event=SCORE[nextScoreIndex++];deliverScoreEvent(event);return
  }
  if(machineState==='closed'&&worldElapsed>=nextAskAt)openQuestion('scheduled')
}
function tick(now){if(!document.hidden&&!terminal){const delta=Math.max(0,now-lastTick);worldElapsed+=delta;processScore()}lastTick=now;requestAnimationFrame(tick)}
el.toBe.addEventListener('click',()=>chooseAnswer('to_be',el.toBe));el.notToBe.addEventListener('click',()=>chooseAnswer('not_to_be',el.notToBe));el.later.addEventListener('click',askLater);el.restart.addEventListener('click',restartWork);
el.remember.addEventListener('change',()=>{if(el.remember.checked&&!storageOK){memoryWarningShown=true;updateMemoryUI()}if(!el.remember.checked&&remembered){remembered=null;visibleRemembered=null;storageWrite(null);updateMemoryUI()}});
el.dialog.addEventListener('cancel',e=>{e.preventDefault();if(machineState==='question')askLater()});
document.addEventListener('visibilitychange',()=>{lastTick=performance.now()});window.addEventListener('resize',()=>requestAnimationFrame(drawClaims));
window.addEventListener('storage',e=>{if(e.key!=='hamlet-pop-upper:answer')return;remembered=e.newValue==='to_be'||e.newValue==='not_to_be'?e.newValue:null;if(machineState==='question'){visibleRemembered=remembered;updateMemoryUI(true)}});
document.addEventListener('pointerdown',unlockAudio,{once:true,capture:true});document.addEventListener('keydown',unlockAudio,{once:true,capture:true});
updateMemoryUI(true);seedCondition();setIdle(true);requestAnimationFrame(()=>{drawClaims();tick(performance.now())});
})();
</script>
